[env:m5stack-papercolor]
platform = espressif32
framework = arduino
board = m5stack-papercolor
build_flags = -DDEBUG_SLEEP_LOG
lib_deps = 
	m5stack/M5Unified@^0.2.19
	tzapu/WiFiManager@^2.0.17
	tobozo/YAMLDuino@^1.5.0
  adafruit/Adafruit NeoPixel@^1.15.5

